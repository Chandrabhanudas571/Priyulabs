  <!-- Smooth Internal Hash Scroll Engine (Overrides <base href="/">) -->
  <script>
    (function() {
      function initSmoothScroll() {
        document.querySelectorAll('a[href^="#"]').forEach(function(anchor) {
          if (anchor.dataset.smoothBound) return;
          anchor.dataset.smoothBound = 'true';
          anchor.addEventListener('click', function(e) {
            var hash = this.getAttribute('href');
            if (hash && hash.length > 1 && !hash.startsWith('#/')) {
              var target = document.querySelector(hash) || 
                           document.getElementById(hash.substring(1)) || 
                           document.getElementById('pillars') || 
                           document.getElementById('matrix-features') || 
                           document.querySelector('.clean-pillars-sec, .pillars-sec, .triptych-sec, .pillars-grid, .clean-container');
              if (target) {
                e.preventDefault();
                e.stopPropagation();
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                if (window.history && window.history.pushState) {
                  window.history.pushState(null, null, hash);
                }
              }
            }
          });
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSmoothScroll);
      } else {
        initSmoothScroll();
      }
    })();
  </script>


  <!-- Seamless Gapless Live Wallpaper Looper Engine (Zero-Pause Double Buffering) -->
  <script id="seamless-video-looper-script">
    (function initSeamlessVideoLooper() {
      const container = document.querySelector('.global-fluid-bg');
      if (!container) return;
      const vids = container.querySelectorAll('video');
      if (!vids || vids.length === 0) return;

      vids.forEach((v) => {
        v.muted = true;
        v.defaultMuted = true;
        v.playsInline = true;
        v.setAttribute('playsinline', '');
        v.setAttribute('webkit-playsinline', '');
      });

      if (vids.length === 1) {
        vids[0].classList.add('is-active');
        vids[0].play().catch(() => { });
        return;
      }

      let activeIdx = 0;
      let swapping = false;

      const activeVid = () => vids[activeIdx];
      const nextVid = () => vids[1 - activeIdx];

      const triggerSwap = () => {
        if (swapping) return;
        swapping = true;

        const current = activeVid();
        const incoming = nextVid();

        try {
          incoming.currentTime = 0;
        } catch (e) { }

        const playPromise = incoming.play();

        const executeTransition = () => {
          incoming.classList.add('is-active');
          current.classList.remove('is-active');

          setTimeout(() => {
            try {
              current.pause();
              current.currentTime = 0;
            } catch (err) { }
            activeIdx = 1 - activeIdx;
            swapping = false;
          }, 350);
        };

        if (playPromise !== undefined) {
          playPromise.then(executeTransition).catch(() => {
            executeTransition();
          });
        } else {
          executeTransition();
        }
      };

      const checkTime = () => {
        const current = activeVid();
        if (current && current.duration && !swapping) {
          const remaining = current.duration - current.currentTime;
          if (remaining <= 0.35 && current.currentTime > 0.5) {
            triggerSwap();
          }
        }
        requestAnimationFrame(checkTime);
      };

      vids.forEach((v) => {
        v.addEventListener('timeupdate', () => {
          if (v === activeVid() && v.duration && !swapping) {
            const remaining = v.duration - v.currentTime;
            if (remaining <= 0.35 && v.currentTime > 0.5) {
              triggerSwap();
            }
          }
        });

        v.addEventListener('ended', () => {
          if (v === activeVid()) {
            triggerSwap();
          }
        });
      });

      const startLooper = () => {
        vids[0].classList.add('is-active');
        const p = vids[0].play();
        if (p !== undefined) {
          p.catch(() => {
            const unlock = () => {
              vids[0].play().catch(() => { });
              window.removeEventListener('click', unlock);
              window.removeEventListener('scroll', unlock);
              window.removeEventListener('touchstart', unlock);
            };
            window.addEventListener('click', unlock, { passive: true, once: true });
            window.addEventListener('scroll', unlock, { passive: true, once: true });
            window.addEventListener('touchstart', unlock, { passive: true, once: true });
          });
        }
        requestAnimationFrame(checkTime);
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startLooper);
      } else {
        startLooper();
      }
    })();
  </script>
