<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="vortexGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- Key Gradients -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d87" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- 3D Shadow for Text -->
    <filter id="drop3D" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background Soft Aura -->
  <circle cx="250" cy="180" r="160" fill="url(#vortexGlow)" />

  <!-- Digital Key Vortex Stream -->
  <g transform="translate(250, 180)">
    <!-- Outer dashed tracks -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="4 8" opacity="0.6" transform="rotate(25)" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#ff2d87" stroke-width="3.5" stroke-dasharray="6 10" opacity="0.7" transform="rotate(-40)" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-dasharray="5 7" opacity="0.8" transform="rotate(75)" />
    <circle cx="0" cy="0" r="65" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4 6" opacity="0.75" transform="rotate(-15)" />

    <!-- Digital Swirling Key Elements -->
    <!-- Top-Right Pink Key -->
    <g transform="translate(45, -75) rotate(45)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#pinkGrad)" stroke-width="4.5" />
      <rect x="-2" y="11" width="4" height="24" rx="2" fill="url(#pinkGrad)" />
      <rect x="2" y="24" width="7" height="4" rx="1" fill="url(#pinkGrad)" />
    </g>

    <!-- Top-Center Magenta Key -->
    <g transform="translate(-15, -92) rotate(105)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="url(#pinkGrad)" stroke-width="5" />
      <rect x="-2.5" y="12" width="5" height="28" rx="2" fill="url(#pinkGrad)" />
      <rect x="2.5" y="28" width="8" height="4.5" rx="1" fill="url(#pinkGrad)" />
    </g>

    <!-- Top-Left Purple Key -->
    <g transform="translate(-75, -55) rotate(160)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="url(#purpleGrad)" stroke-width="4.5" />
      <rect x="-2" y="10" width="4" height="22" rx="2" fill="url(#purpleGrad)" />
      <rect x="2" y="22" width="6" height="3.5" rx="1" fill="url(#purpleGrad)" />
    </g>

    <!-- Left-Middle Cyan Key -->
    <g transform="translate(-85, 20) rotate(220)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="url(#cyanGrad)" stroke-width="5" />
      <rect x="-2.5" y="12" width="5" height="26" rx="2" fill="url(#cyanGrad)" />
      <rect x="2.5" y="26" width="7" height="4" rx="1" fill="url(#cyanGrad)" />
    </g>

    <!-- Bottom-Left Cyan/Blue Key -->
    <g transform="translate(-40, 75) rotate(280)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" />
      <rect x="-2" y="11" width="4" height="24" rx="2" fill="url(#cyanGrad)" />
      <rect x="2" y="24" width="7" height="4" rx="1" fill="url(#cyanGrad)" />
    </g>

    <!-- Bottom-Right Gold Key -->
    <g transform="translate(45, 65) rotate(335)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" />
      <rect x="-2" y="11" width="4" height="24" rx="2" fill="url(#goldGrad)" />
      <rect x="2" y="22" width="7" height="4" rx="1" fill="url(#goldGrad)" />
    </g>

    <!-- Right-Middle Gold/Orange Key -->
    <g transform="translate(85, -15) rotate(390)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" />
      <rect x="-2" y="10" width="4" height="22" rx="2" fill="url(#goldGrad)" />
      <rect x="2" y="21" width="6" height="3.5" rx="1" fill="url(#goldGrad)" />
    </g>

    <!-- Scattered digital data squares -->
    <rect x="-105" y="-15" width="8" height="8" fill="#ff2d87" rx="1.5" />
    <rect x="-85" y="-85" width="9" height="9" fill="#a855f7" rx="1.5" />
    <rect x="20" y="-115" width="7" height="7" fill="#ff2d87" rx="1.5" />
    <rect x="90" y="30" width="8" height="8" fill="#fbbf24" rx="1.5" />
    <rect x="-30" y="100" width="9" height="9" fill="#00e5ff" rx="1.5" />

    <!-- Center Bold P Letter -->
    <text x="0" y="24" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="76" fill="#ffffff" text-anchor="middle" letter-spacing="1">P</text>
  </g>

  <!-- PRIYULABS Text with 3D Shadow -->
  <text x="250" y="390" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="6" filter="url(#drop3D)">
    PRIYULABS
  </text>

  <!-- DIGITAL Subtitle in Gold -->
  <text x="250" y="430" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="21" fill="#d9a74a" text-anchor="middle" letter-spacing="12">
    DIGITAL
  </text>
</svg>
